[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "locallm"
version = "0.1.0"
description = "Local LLM CLI & Interactive TUI Platform for Ollama"
readme = "README.md"
authors = [{ name = "locaLLM Team" }]
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "httpx>=0.27.0",
    "python-telegram-bot>=20.0",
    "pydantic>=2.0.0",
    "psutil>=5.9.0",
    "openai>=1.0.0",
]

[project.scripts]
locallm = "locallm.cli:main"
locaLLM = "locallm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["locallm*"]

[tool.setuptools.package-data]
"locallm" = ["bridges/whatsapp/*"]

